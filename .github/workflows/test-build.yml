name: "Test Build"

# Builds an installer every time you save a change to main, and lets you
# download it from the Actions tab. No release and no version tag needed.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:   # also adds a "Run workflow" button in the Actions tab

# If you push again while a build is running, cancel the old one.
concurrency:
  group: test-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Saves compiled Rust parts between runs so later builds are much faster.
      - name: cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: install dependencies
        run: npm install

      - name: build installer
        run: npm run tauri build

      - name: upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OptiBOOST-test-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
