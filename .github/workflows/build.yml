name: Build OptiBOOST App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Create Dummy Icon for Build
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons"
          # Create a dummy file to satisfy the compiler check
          Set-Content -Path "src-tauri/icons/icon.ico" -Value "dummy icon content"

      - name: Install dependencies & Build
        run: |
          npm install
          npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: OptiBOOST-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
