name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm install

      - name: Run Tauri Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __TAURI_RELEASE_TAG__
          releaseName: 'OptiBOOST __TAURI_RELEASE_TAG__'
          releaseBody: 'Official release of OptiBOOST v1.0.0'
          releaseDraft: false
          prerelease: false
